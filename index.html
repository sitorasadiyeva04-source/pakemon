<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pokemons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
    <!-- Шапка с поиском и кнопками -->
    <div class="top-bar">
        <input type="text" id="searchInput" placeholder="search your pokemon">
        <button class="btn">all</button>
        <button class="btn">sort</button>
        <button class="search-btn">seach</button>
    </div>

    <!-- Сюда с помощью JavaScript будут выводиться карточки -->
    <div id="pokemonsContainer" class="grid"></div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
